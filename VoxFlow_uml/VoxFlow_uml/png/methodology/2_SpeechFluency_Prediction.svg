<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1751.3542px" preserveAspectRatio="none" style="width:825px;height:1751px;background:#F8FAFC;" version="1.1" viewBox="0 0 825 1751" width="825.2083px" zoomAndPan="magnify"><title>&lt;size:20&gt;&lt;b&gt;VoxFlow - HuBERT-D Session Analysis Flow&lt;/b&gt;&lt;/size&gt;</title><defs/><g><rect fill="#F8FAFC" height="1751.3542" style="stroke:none;stroke-width:1.7708333333333333;" width="825.2083" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="35.4167" font-weight="bold" lengthAdjust="spacing" textLength="749.7508" x="35.4167" y="72.1822">VoxFlow - HuBERT-D Session Analysis Flow</text><text fill="#000000" font-family="sans-serif" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="578.4399" x="121.0721" y="102.0235">Continuous Audio Validation &amp; Sliding-Window Inference</text><ellipse cx="422.7575" cy="143.8802" fill="#86EFAC" rx="17.7083" ry="17.7083" style="stroke:#222222;stroke-width:1.7708333333333333;"/><rect fill="#E0F2FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="284.4055" x="280.5547" y="197.0052"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="177.1871" x="298.2631" y="233.0963">Receive session audio</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="248.9889" x="298.2631" y="255.3701">(WAV container / 16 kHz mono)</text><rect fill="#E0F2FE" height="124.5117" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="313.9684" x="265.7733" y="312.3861"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="168.3502" x="283.4816" y="348.4772">Validate audio signal:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="277.566" x="283.4816" y="370.7509">- Minimum duration &gt;= 3.0 seconds</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="222.435" x="283.4816" y="393.0247">- RMS speech energy check</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="278.5517" x="283.4816" y="415.2985">- Float32 normalization in [-1.0, 1.0]</text><rect fill="#EDE9FE" height="102.238" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="383.3577" x="231.0786" y="472.3145"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="283.4544" x="248.787" y="508.4056">Initialize sliding-window parameters:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="341.0411" x="248.787" y="530.6793">- Window Duration = 3.0s (48,000 samples)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="347.9411" x="248.787" y="552.9531">- Window Step Hop = 1.0s (16,000 samples)</text><rect fill="#EDE9FE" height="57.6904" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="337.5738" x="253.9706" y="710.763"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="302.1571" x="271.6789" y="746.8541">Extract 3.0-second waveform segment</text><rect fill="#C4B5FD" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="348.4599" x="248.5276" y="803.8701"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="234.2031" x="266.2359" y="839.9612">Pass waveform to HuBERT-D</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="313.0432" x="266.2359" y="862.235">(facebook/hubert-base-ls960 backbone)</text><rect fill="#C4B5FD" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="310.0688" x="267.7231" y="919.251"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="274.6521" x="285.4314" y="955.3421">Compute 3 independent multi-label</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="234.255" x="285.4314" y="977.6159">sigmoid posterior probabilities</text><rect fill="#DDD6FE" height="124.5117" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="383.8938" x="230.8106" y="1034.6319"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="348.4772" x="248.5189" y="1070.723">Evaluate against locked decision thresholds:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="202.7898" x="248.5189" y="1092.9967">- Repetition: Prob &gt;= 0.77</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="222.4869" x="248.5189" y="1115.2705">- Prolongation: Prob &gt;= 0.79</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="166.3528" x="248.5189" y="1137.5443">- Block: Prob &gt;= 0.57</text><polygon fill="#F5F3FF" points="322.8325,1194.5602,522.6825,1194.5602,543.9325,1215.8102,522.6825,1237.0602,322.8325,1237.0602,301.5825,1215.8102,322.8325,1194.5602" style="stroke:#7C3AED;stroke-width:2.65625;"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="199.85" x="322.8325" y="1223.0561">Any threshold exceeded?</text><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="33.5654" x="268.0171" y="1211.5302">Yes</text><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="24.9006" x="543.9325" y="1211.5302">No</text><rect fill="#FCA5A5" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="310.0342" x="106.595" y="1254.7686"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="257.8171" x="124.3033" y="1290.8597">Classify window as DISFLUENT;</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="274.6175" x="124.3033" y="1313.1334">Assign active label(s) &amp; confidence</text><rect fill="#86EFAC" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="263.7141" x="452.0458" y="1254.7686"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="228.2974" x="469.7542" y="1290.8597">Classify window as FLUENT;</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="198.3714" x="469.7542" y="1313.1334">Assign confidence = 0.99</text><polygon fill="#F5F3FF" points="422.7575,1345.3578,444.0075,1366.6078,422.7575,1387.8578,401.5075,1366.6078,422.7575,1345.3578" style="stroke:#7C3AED;stroke-width:2.65625;"/><rect fill="#DCFCE7" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="424.2304" x="210.6423" y="1423.2744"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="185.0642" x="228.3506" y="1459.3655">Append window record:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="388.8138" x="228.3506" y="1481.6393">{start_time, end_time, probabilities, active_labels}</text><polygon fill="#F5F3FF" points="328.7598,609.9691,516.7552,609.9691,538.0052,631.2191,516.7552,652.4691,328.7598,652.4691,307.5098,631.2191,328.7598,609.9691" style="stroke:#7C3AED;stroke-width:2.65625;"/><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="33.5654" x="429.8408" y="672.6901">Yes</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="187.9954" x="328.7598" y="638.465">Window slice available?</text><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="24.9006" x="282.6092" y="626.939">No</text><rect fill="#DCFCE7" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="323.7996" x="260.8577" y="1577.6136"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="288.383" x="278.566" y="1613.7047">Pass complete window prediction list</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="237.2208" x="278.566" y="1635.9785">to Temporal Event Aggregator</text><ellipse cx="422.7575" cy="1712.4737" fill="none" rx="19.4792" ry="19.4792" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><ellipse cx="422.7575" cy="1712.4737" fill="#222222" rx="10.625" ry="10.625" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="422.7575" x2="422.7575" y1="161.5885" y2="197.0052"/><polygon fill="#64748B" points="415.6742,179.2969,422.7575,197.0052,429.8408,179.2969,422.7575,186.3802" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="422.7575" x2="422.7575" y1="276.9694" y2="312.3861"/><polygon fill="#64748B" points="415.6742,294.6777,422.7575,312.3861,429.8408,294.6777,422.7575,301.7611" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="422.7575" x2="422.7575" y1="436.8978" y2="472.3145"/><polygon fill="#64748B" points="415.6742,454.6061,422.7575,472.3145,429.8408,454.6061,422.7575,461.6895" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-wid