<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1168.75px" preserveAspectRatio="none" style="width:1005px;height:1168px;background:#F8FAFC;" version="1.1" viewBox="0 0 1005 1168" width="1005.8333px" zoomAndPan="magnify"><title>&lt;size:20&gt;&lt;b&gt;VoxFlow - Event Aggregation &amp; Session Analytics Flow&lt;/b&gt;&lt;/size&gt;</title><defs/><g><rect fill="#F8FAFC" height="1168.75" style="stroke:none;stroke-width:1.7708333333333333;" width="1005.8333" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="35.4167" font-weight="bold" lengthAdjust="spacing" textLength="930.8116" x="35.4167" y="72.1822">VoxFlow - Event Aggregation &amp; Session Analytics Flow</text><text fill="#000000" font-family="sans-serif" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="675.3931" x="163.1259" y="102.0235">Temporal Clustering, Metric Calculation &amp; Dashboard Visualization</text><ellipse cx="503.4787" cy="143.8802" fill="#86EFAC" rx="17.7083" ry="17.7083" style="stroke:#222222;stroke-width:1.7708333333333333;"/><rect fill="#E0F2FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="332.6538" x="337.1518" y="197.0052"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="297.2371" x="354.8601" y="233.0963">Receive window-level prediction array</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="255.9148" x="354.8601" y="255.3701">from Session Processing Engine</text><rect fill="#EDE9FE" height="146.7855" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="434.0703" x="286.4435" y="312.3861"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="299.2432" x="304.1519" y="348.4772">Execute Temporal Event Aggregation:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="319.8741" x="304.1519" y="370.7509">- Iterate across active window categories</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="398.6537" x="304.1519" y="393.0247">- Group consecutive overlapping disfluent windows</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="374.0194" x="304.1519" y="415.2985">- Calculate event start time, end time &amp; duration</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="318.9489" x="304.1519" y="437.5722">- Compute average detection confidence</text><rect fill="#DDD6FE" height="124.5117" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="434.5113" x="286.223" y="494.5882"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="275.5686" x="303.9314" y="530.6793">Calculate Session Fluency Metrics:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="326.7395" x="303.9314" y="552.9531">- Count Total Windows &amp; Fluent Windows</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="399.0946" x="303.9314" y="575.2268">- Compute Session Fluency Ratio = (Fluent / Total)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="374.054" x="303.9314" y="597.5006">- Count Repetition, Prolongation &amp; Block events</text><rect fill="#ECFDF5" height="124.5117" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="563.9257" x="221.5159" y="654.5166"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="414.33" x="239.2242" y="690.6077">Persist atomic session record in SQLite (voxflow.db):</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="477.5543" x="239.2242" y="712.8815">- UPDATE sessions (duration, status="ANALYZED", metrics)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="528.509" x="239.2242" y="735.1552">- INSERT INTO session_windows (probabilities, labels, confidence)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="479.3009" x="239.2242" y="757.429">- INSERT INTO session_events (type, start, end, confidence)</text><rect fill="#DCFCE7" height="57.6904" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="452.7557" x="277.1008" y="814.445"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="417.3391" x="294.8092" y="850.5361">Streamlit Dashboard queries latest / selected session</text><rect fill="#DCFCE7" height="169.0592" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="470.3949" x="268.2813" y="907.5521"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="330.7256" x="285.9896" y="943.6432">Render Interactive Session Visualizations:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="416.2755" x="285.9896" y="965.917">- Key Summary Cards (Duration, Fluency %, Counts)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="434.9782" x="285.9896" y="988.1907">- Multi-Label Probability Timeline (Rep, Pro, Blk curves)</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="327.7598" x="285.9896" y="1010.4645">- Window-Level Model Output Audit Table</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="320.8771" x="285.9896" y="1032.7382">- Aggregated Disfluency Event Visualizer</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="298.2661" x="285.9896" y="1055.012">- Longitudinal Speech Fluency Trends</text><ellipse cx="503.4787" cy="1131.5072" fill="none" rx="19.4792" ry="19.4792" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><ellipse cx="503.4787" cy="1131.5072" fill="#222222" rx="10.625" ry="10.625" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="161.5885" y2="197.0052"/><polygon fill="#64748B" points="496.3954,179.2969,503.4787,197.0052,510.562,179.2969,503.4787,186.3802" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="276.9694" y2="312.3861"/><polygon fill="#64748B" points="496.3954,294.6777,503.4787,312.3861,510.562,294.6777,503.4787,301.7611" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="459.1715" y2="494.5882"/><polygon fill="#64748B" points="496.3954,476.8799,503.4787,494.5882,510.562,476.8799,503.4787,483.9632" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="619.0999" y2="654.5166"/><polygon fill="#64748B" points="496.3954,636.8083,503.4787,654.5166,510.562,636.8083,503.4787,643.8916" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="779.0283" y2="814.445"/><polygon fill="#64748B" points="496.3954,796.7367,503.4787,814.445,510.562,796.7367,503.4787,803.82" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="503.4787" x2="503.4787" y1="872.1354" y2="907.5521"/><p