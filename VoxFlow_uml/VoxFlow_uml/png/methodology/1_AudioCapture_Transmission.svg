-serif" font-size="17.7083" lengthAdjust="spacing" textLength="346.3674" x="280.2082" y="370.7509">Set Status LED (GPIO4) to OUTPUT (LOW)</text><rect fill="#DBEAFE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="411.3815" x="315.6119" y="427.7669"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="375.9649" x="333.3202" y="463.858">Allocate audio buffer (PSRAM / Internal SRAM);</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="372.7397" x="333.3202" y="486.1318">Emit "READY" &amp; synchronize via PING / PONG</text><polygon fill="#F5F3FF" points="417.4781,543.1478,625.1273,543.1478,646.3773,564.3978,625.1273,585.6478,417.4781,585.6478,396.2281,564.3978,417.4781,543.1478" style="stroke:#7C3AED;stroke-width:2.65625;"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="207.6492" x="417.4781" y="571.6437">START Trigger Received?</text><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="281.4683" x="114.7598" y="560.1177">Physical Button or Serial START</text><text fill="#000000" font-family="sans-serif" font-size="19.4792" lengthAdjust="spacing" textLength="24.9006" x="646.3773" y="560.1177">No</text><rect fill="#BFDBFE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="322.7534" x="180.7125" y="603.3561"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="287.3367" x="198.4209" y="639.4472">Turn Status LED ON (GPIO4 HIGH);</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="168.2897" x="198.4209" y="661.721">Clear I2S DMA buffer</text><rect fill="#BFDBFE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="346.4539" x="168.8623" y