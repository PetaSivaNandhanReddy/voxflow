<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <!-- Background -->
  <rect width="1400" height="950" fill="#F8FAFC"/>
  <rect x="25" y="25" width="1350" height="900" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="25" y="25" width="1350" height="85" rx="16" fill="#0F172A"/>
  <text x="700" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">VoxFlow — Hardware Wiring Schematic</text>
  <text x="700" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" fill="#94A3B8">ESP32 Dev Module + INMP441 I²S Microphone + START/STOP Pushbuttons + Status LED</text>

  <style>
    .comp-title { font: 800 18px 'Plus Jakarta Sans', Arial, sans-serif; fill: #FFFFFF; }
    .comp-sub { font: 500 13px 'Plus Jakarta Sans', Arial, sans-serif; fill: #CBD5E1; }
    .pin-box { fill: #1E293B; rx: 6px; }
    .pin-txt { font: 700 13px 'Plus Jakarta Sans', Arial, sans-serif; fill: #F8FAFC; }
    .pin-lbl { font: 600 12px 'Plus Jakarta Sans', Arial, sans-serif; fill: #64748B; }
    .wire { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire-lbl { font: 700 12px 'Plus Jakarta Sans', Arial, sans-serif; fill: #334155; }
    .card-title { font: 700 15px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0F172A; }
    .card-txt { font: 500 13px 'Plus Jakarta Sans', Arial, sans-serif; fill: #475569; }
  </style>

  <!-- ============================================================ -->
  <!-- ESP32 DEV MODULE COMPONENT -->
  <!-- ============================================================ -->
  <rect x="75" y="145" width="380" height="640" rx="16" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  <text x="265" y="185" text-anchor="middle" class="comp-title">ESP32 Dev Module</text>
  <text x="265" y="208" text-anchor="middle" class="comp-sub">38-Pin Microcontroller Core</text>

  <!-- ESP-WROOM-32 Chip Visual -->
  <rect x="155" y="235" width="220" height="110" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <text x="265" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">ESP-WROOM-32</text>
  <text x="265" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Dual Core 240MHz • 16kHz I²S</text>

  <!-- ESP32 Pin Headers -->
  <!-- Left Side: Power & I2S Pins -->
  <rect x="100" y="380" width="130" height="36" rx="6" fill="#DC2626"/><text x="120" y="403" class="pin-txt">3V3 (Power)</text>
  <rect x="100" y="430" width="130" height="36" rx="6" fill="#1E293B"/><text x="120" y="453" class="pin-txt">GND (Ground)</text>
  <rect x="100" y="480" width="130" height="36" rx="6" fill="#0284C7"/><text x="120" y="503" class="pin-txt">GPIO 26 (SCK)</text>
  <rect x="100" y="530" width="130" height="36" rx="6" fill="#0D9488"/><text x="120" y="553" class="pin-txt">GPIO 25 (WS)</text>
  <rect x="100" y="580" width="130" height="36" rx="6" fill="#4F46E5"/><text x="120" y="603" class="pin-txt">GPIO 32 (SD)</text>

  <!-- Right Side: Button & LED GPIO Pins -->
  <rect x="305" y="380" width="130" height="36" rx="6" fill="#16A34A"/><text x="320" y="403" class="pin-txt">GPIO 27 (START)</text>
  <rect x="305" y="430" width="130" height="36" rx="6" fill="#E11D48"/><text x="320" y="453" class="pin-txt">GPIO 33 (STOP)</text>
  <rect x="305" y="480" width="130" height="36" rx="6" fill="#D97706"/><text x="320" y="503" class="pin-txt">GPIO 4 (LED)</text>
  <rect x="305" y="530" width="130" height="36" rx="6" fill="#1E293B"/><text x="320" y="553" class="pin-txt">GND (Return)</text>

  <!-- USB Port Label -->
  <rect x="195" y="745" width="140" height="30" rx="6" fill="#334155"/>
  <text x="265" y="765" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF">USB Serial / COM8</text>

  <!-- ============================================================ -->
  <!-- INMP441 I2S MICROPHONE MODULE -->
  <!-- ============================================================ -->
  <rect x="520" y="145" width="360" height="320" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
  <rect x="520" y="145" width="360" height="50" rx="16" fill="#E0F2FE"/>
  <text x="700" y="176" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#0369A1">INMP441 MEMS Microphone</text>

  <!-- Mic Capsule Graphic -->
  <circle cx="700" cy="255" r="44" fill="#0F172A" stroke="#CBD5E1" stroke-width="6"/>
  <circle cx="700" cy="255" r="28" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <circle cx="700" cy="255" r="6" fill="#CBD5E1"/>

  <!-- INMP441 Pin Header -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <rect x="545" y="345" width="50" height="28" rx="4" fill="#DC2626"/><text x="557" y="364" class="pin-txt" font-size="11">VDD</text>
    <rect x="605" y="345" width="50" height="28" rx="4" fill="#1E293B"/><text x="617" y="364" class="pin-txt" font-size="11">GND</text>
    <rect x="665" y="345" width="50" height="28" rx="4" fill="#0284C7"/><text x="677" y="364" class="pin-txt" font-size="11">SCK</text>
    <rect x="725" y="345" width="50" height="28" rx="4" fill="#0D9488"/><text x="739" y="364" class="pin-txt" font-size="11">WS</text>
    <rect x="785" y="345" width="50" height="28" rx="4" fill="#4F46E5"/><text x="801" y="364" class="pin-txt" font-size="11">SD</text>
    <rect x="840" y="345" width="30" height="28" rx="4" fill="#1E293B"/><text x="844" y="364" class="pin-txt" font-size="10">L/R</text>
  </g>
  <text x="700" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">L/R pin wired to GND = LEFT Audio Channel</text>

  <!-- ============================================================ -->
  <!-- BUTTON CONTROLS & STATUS LED MODULES -->
  <!-- ============================================================ -->

  <!-- START Button -->
  <rect x="940" y="145" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <rect x="940" y="145" width="410" height="40" rx="14" fill="#DCFCE7"/>
  <text x="1145" y="171" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#15803D">START Pushbutton (Active LOW)</text>
  <circle cx="995" cy="235" r="22" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
  <text x="995" y="241" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#FFFFFF">START</text>
  <text x="1035" y="225" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">GPIO 27 ──[ Pushbutton ]── GND</text>
  <text x="1035" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" fill="#64748B">Configured with internal INPUT_PULLUP resistor</text>

  <!-- STOP Button -->
  <rect x="940" y="315" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <rect x="940" y="315" width="410" height="40" rx="14" fill="#FFE4E6"/>
  <text x="1145" y="341" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#BE123C">STOP Pushbutton (Active LOW)</text>
  <circle cx="995" cy="405" r="22" fill="#E11D48" stroke="#881337" stroke-width="3"/>
  <text x="995" y="411" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#FFFFFF">STOP</text>
  <text x="1035" y="395" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">GPIO 33 ──[ Pushbutton ]── GND</text>
  <text x="1035" y="418" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" fill="#64748B">Configured with internal INPUT_PULLUP resistor</text>

  <!-- Status LED -->
  <rect x="940" y="485" width="410" height="160" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <rect x="940" y="485" width="410" height="40" rx="14" fill="#FEF3C7"/>
  <text x="1145" y="511" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#B45309">Status Indicator LED</text>
  <circle cx="995" cy="580" r="20" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
  <rect x="1035" y="565" width="60" height="28" rx="4" fill="#D6B27C" stroke="#8B5E34" stroke-width="1.5"/>
  <text x="1065" y="584" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#0F172A">330 Ω</text>
  <text x="1115" y="575" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">GPIO 4 ──[ 330Ω ]── Anode (+)</text>
  <text x="1115" y="596" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" fill="#64748B">Cathode (-) wired to GND • ON during recording</text>

  <!-- ============================================================ -->
  <!-- WIRING TRACES -->
  <!-- ============================================================ -->

  <!-- INMP441 Traces -->
  <!-- 3.3V (Red) -->
  <path d="M230 398 H490 V310 H570 V345" class="wire" stroke="#DC2626"/>
  <!-- GND (Black) -->
  <path d="M230 448 H500 V325 H630 V345" class="wire" stroke="#1E293B"/>
  <!-- SCK / GPIO26 (Sky Blue) -->
  <path d="M230 498 H480 V370 H690 V373" class="wire" stroke="#0284C7"/>
  <!-- WS / GPIO25 (Teal) -->
  <path d="M230 548 H470 V400 H750 V373" class="wire" stroke="#0D9488"/>
  <!-- SD / GPIO32 (Indigo) -->
  <path d="M230 598 H460 V420 H810 V373" class="wire" stroke="#4F46E5"/>
  <!-- L/R to GND jumper (Black) -->
  <path d="M855 373 V415 H630 V373" class="wire" stroke="#1E293B" stroke-width="2.5"/>

  <!-- START Button Trace (Green) -->
  <path d="M435 398 H915 V235 H973" class="wire" stroke="#16A34A"/>

  <!-- STOP Button Trace (Rose) -->
  <path d="M435 448 H900 V405 H973" class="wire" stroke="#E11D48"/>

  <!-- Status LED Trace (Amber) -->
  <path d="M435 498 H890 V580 H975" class="wire" stroke="#D97706"/>

  <!-- ============================================================ -->
  <!-- WIRING SUMMARY TABLE CARD -->
  <!-- ============================================================ -->
  <rect x="75" y="805" width="1275" height="100" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="95" y="833" class="card-title">VoxFlow Phase-2 Electrical Interconnection Summary</text>
  <text x="95" y="858" class="card-txt">• <b>INMP441 I²S Mic:</b> VDD → 3.3V, GND → GND, SCK/BCLK → GPIO26, WS → GPIO25, SD → GPIO32, L/R → GND (Left Channel)</text>
  <text x="95" y="882" class="card-txt">• <b>Control Interface:</b> START Pushbutton → GPIO27 (INPUT_PULLUP to GND) | STOP Pushbutton → GPIO33 (INPUT_PULLUP to GND)</text>
  <text x="95" y="898" class="card-txt">• <b>Status Indicator:</b> GPIO4 → 330 Ω Resistor → LED Anode (+) | LED Cathode (-) → GND (Active High, Illuminates During Active Capture)</text>
</svg>