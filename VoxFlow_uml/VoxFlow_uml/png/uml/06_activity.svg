07.0822">WAV Upload</text><rect fill="#BFDBFE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="309.0139" x="19.4792" y="350.3206"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="247.9945" x="37.1875" y="386.4117">Press START button (GPIO27);</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="273.5972" x="37.1875" y="408.6855">Capture 16 kHz PCM via INMP441</text><rect fill="#BFDBFE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="302.1398" x="22.9162" y="465.7015"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="241.1377" x="40.6245" y="501.7926">Stream audio over USB Serial;</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="266.7231" x="40.6245" y="524.0664">Assemble WAV via Python Bridge</text><rect fill="#BFDBFE" height="57.6904" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="304.0853" x="21.9435" y="581.0824"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="268.6686" x="39.6518" y="617.1735">Submit WAV to Flask Session API</text><rect fill="#DCFCE7" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="261.7859" x="363.9097" y="350.3206"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="226.3692" x="381.618" y="386.4117">Upload existing 16 kHz WAV</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="188.9725" x="381.618" y="408.6855">via Streamlit Dashboard</text><polygon fill="#F5F3FF" points="334.3944,649.3978,355.6444,670.6478,334.3944,691.8978,313.1444,670.6478,334.3944,649.3978" style="stroke:#7C3AED;stroke-width:2.65625;"/><rect fill="#EDE9FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="315.9053" x="176.4418" y="727.3145"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="230.364" x="194.1501" y="763.4056">Validate &amp; Standardize Audio</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="280.4886" x="194.1501" y="785.6793">(16 kHz Mono, RMS check, &gt;=3.0s)</text><rect fill="#EDE9FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="297.2371" x="185.7758" y="842.6953"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="261.8205" x="203.4841" y="878.7864">Slice recording into 3.0s windows</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="197.8612" x="203.4841" y="901.0602">with 1.0s sliding hop step</text><rect fill="#C4B5FD" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="278.569" x="195.1099" y="958.0762"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="243.0745" x="212.8182" y="994.1673">Execute HuBERT-D multi-label</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="243.1524" x="212.8182" y="1016.441">inference on each 3.0s window</text><rect fill="#C4B5FD" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="316.0004" x="176.3942" y="1073.457"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="280.5837" x="194.1025" y="1109.5481">Generate independent probabilities:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="242.158" x="194.1025" y="1131.8219">Repetition, Prolongation, Block</text><rect fill="#DDD6FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="302.183" x="183.3029" y="1188.8379"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="266.7664" x="201.0112" y="1224.929">Apply locked validation thresholds</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="249.0321" x="201.0112" y="1247.2028">(Rep: 0.77, Pro: 0.79, Blk: 0.57)</text><rect fill="#DDD6FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="339.5798" x="164.6045" y="1304.2188"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="304.1631" x="182.3128" y="1340.3099">Aggregate consecutive active windows</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="236.235" x="182.3128" y="1362.5836">into discrete disfluency events</text><rect fill="#DDD6FE" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="305.1056" x="181.8416" y="1419.5996"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="269.6889" x="199.5499" y="1455.6907">Compute Session Fluency Ratio &amp;</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="256.8314" x="199.5499" y="1477.9645">overall session summary metrics</text><rect fill="#ECFDF5" height="79.9642" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="372.0479" x="148.3704" y="1534.9805"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="330.717" x="166.0787" y="1571.0716">Persist session record, window audit data,</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="336.6313" x="166.0787" y="1593.3453">and event timeline into SQLite (voxflow.db)</text><rect fill="#DCFCE7" height="146.7855" rx="22.1354" ry="22.1354" style="stroke:#334155;stroke-width:2.65625;" width="373.0509" x="147.8689" y="1650.3613"/><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="299.1913" x="165.5772" y="1686.4524">Render interactive results in Streamlit:</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="276.5284" x="165.5772" y="1708.7262">- Key Metric Cards &amp; Fluency Ratio</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="336.5794" x="165.5772" y="1731">- Temporal Multi-Label Probability Timeline</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="327.7598" x="165.5772" y="1753.2737">- Window-Level Model Output Audit Table</text><text fill="#0F172A" font-family="sans-serif" font-size="17.7083" lengthAdjust="spacing" textLength="337.6343" x="165.5772" y="1775.5475">- Event Visualization &amp; Longitudinal Trends</text><ellipse cx="334.3944" cy="1852.0426" fill="none" rx="19.4792" ry="19.4792" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><ellipse cx="334.3944" cy="1852.0426" fill="#222222" rx="10.625" ry="10.625" style="stroke:#FCA5A5;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="334.3944" x2="334.3944" y1="161.5885" y2="197.0052"/><polygon fill="#64748B" points="327.311,179.2969,334.3944,197.0052,341.4777,179.2969,334.3944,186.3802" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke:#64748B;stroke-width:2.3020833333333335;" x1="173.9861" x2="173.9861" y1="430.2848" y2="465.7015"/><polygon fill="#64748B" points="166.9028,447.9932,173.9861,465.7015,181.0694,447.9932,173.9861,455.0765" style="stroke:#64748B;stroke-width:1.7708333333333333;"/><line style="stroke